# Hermes Agent — Zabbix agent2 UserParameter configuration
#
# Place this file at /etc/zabbix/zabbix_agent2.d/hermes_agent.conf
# and restart the agent2 service.
#
# Scripts must be installed at /etc/zabbix/scripts/.

# ── Low-Level Discovery ────────────────────────────────────────
# Returns JSON array of profiles with API_SERVER_ENABLED=true.
UserParameter=hermes.profiles.discovery, python3 /etc/zabbix/scripts/hermes_lld.py

# ── Per-profile data ───────────────────────────────────────────
# $1 = command (health/tokens), $2 = field (ignored by script, used for unique keys),
# $3 = profile, $4 = host, $5 = port, $6 = api key (all from template macros)
UserParameter=hermes.check[*], python3 /etc/zabbix/scripts/hermes_check.py $1 $3 $4 $5 $6
